[project]
name = "automatic-bias-detection"
version = "0.1.0"
description = "Automatic bias detection dashboard for financial LLM evaluation papers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "litellm>=1.50.0",
    "instructor>=1.7.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["core*"]
